<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AF - Educação Financeira</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="icon" href="./assets/favicon.ico">
</head>

<body>

    <div id="navbar"></div>

    <main>

        <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel">

            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img class="d-block w-100 slide-img" src="./assets/slide/img1.png" alt="Primeiro slide">
                </div>

                <div class="carousel-item">
                    <img class="d-block w-100 slide-img" src="./assets/slide/img2.png" alt="Segundo slide">
                </div>

                <div class="carousel-item">
                    <img class="d-block w-100 slide-img" src="./assets/slide/img3.png" alt="Terceiro slide">
                </div>

            </div>

            <!-- Botão anterior -->
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls"
                data-bs-slide="prev">

                <span class="carousel-control-prev-icon" aria-hidden="true"></span>

                <span class="visually-hidden">Anterior</span>

            </button>

            <!-- Botão próximo -->
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls"
                data-bs-slide="next">

                <span class="carousel-control-next-icon" aria-hidden="true"></span>

                <span class="visually-hidden">Próximo</span>

            </button>

        </div>
        <section>




            <div class="logoGrafica">
                <img src="./assets/Gráfica JJA.png" alt="Logo Gráfica JJA">
            </div>


            <div class="intro-text text-center fs-5">
                <p>
                    Desde 2013, impulsionando o seu negócio e dando
                    visibilidade à sua marca.
                </p>
            </div>

        </section>

        <section>

        </section>


        <div id="footer"></div>

    </main>


    <script src="./js/buttons.js"></script>
    <script src="./js/NavbarLoader.js"></script>
    <script src="./js/FooterLoader.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
